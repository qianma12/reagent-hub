appId: com.reagent.hub
productName: Reagent Hub
copyright: Copyright © 2024
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - electron/**/*
  - package.json
extraMetadata:
  main: electron/main.js
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: src-tauri/icons/icon.icns
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: src-tauri/icons/icon.ico
linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: src-tauri/icons/256x256.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: qianma12
  repo: reagent-hub
